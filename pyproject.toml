[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prouty-helicopter-design"
version = "0.1.0"
description = "OpenMDAO implementation of R.W. Prouty's helicopter preliminary design methods"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openmdao>=3.30",
    "numpy>=1.22",
]

[project.optional-dependencies]
validation = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
