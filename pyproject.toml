[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prouty"
version = "0.3.0"
description = "Prouty's Helicopter Performance, Stability and Control as OpenMDAO models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "openmdao>=3.30", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: converges G2, several seconds to minutes per test",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
